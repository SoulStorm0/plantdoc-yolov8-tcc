[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantdoc-tcc"
version = "0.1.0"
description = "Experimentos reprodutíveis de detecção de doenças foliares com YOLOv8"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "ultralytics==8.4.21",
  "PyYAML==6.0.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[project.scripts]
plantdoc-tcc = "plantdoc_tcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

