name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Validate Colab notebook
        run: python -c "import json; n=json.load(open('notebooks/plantdoc_yolov8_colab.ipynb', encoding='utf-8')); assert n['nbformat'] == 4"
